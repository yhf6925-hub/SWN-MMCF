# Reviewer-facing example only. Replace values with the manuscript settings.
swn:
  max_window_clones: 10
  min_window_clones: 3
  min_track_quality: 0.25

mmcf:
  enable_visual_term: true
  enable_inertial_term: true
  enable_cross_modal_term: true
  min_constraint_confidence: 0.50
  max_constraints_per_update: 40

robust_update:
  innovation_gate_probability: 0.95
  numerical_epsilon: 1.0e-9

integration:
  # Must match the tested OpenVINS configuration.
  openvins_commit: "TODO_FULL_COMMIT_SHA"
  state_snapshot_after_camera_update: true
  preserve_openvins_marginalization: true

